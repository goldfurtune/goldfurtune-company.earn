<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f0c06"><title>Gold Fortune — Support</title><link rel="icon" href="icon-2.png"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0f0c06;--card:#1c1710;--border:#4a3c24;--gold:#e8c547;--text:#f5eedc;--muted:#a79778}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 320px at 50% 0,rgba(232,197,71,.1),transparent 70%),var(--bg);color:var(--text);font-family:DM Sans,sans-serif}.wrap{width:min(720px,100%);margin:auto;padding:22px 16px 48px}.top{display:flex;align-items:center;gap:14px;margin:8px 0 28px}.back{width:44px;height:44px;border:1px solid var(--border);border-radius:13px;display:grid;place-items:center;color:var(--gold);text-decoration:none;font-size:30px}.top h1{font:700 2rem 'Playfair Display',serif;margin:0}.hero,.support-card{background:linear-gradient(145deg,#272016,#19140d);border:1px solid rgba(232,197,71,.32);border-radius:24px;padding:26px;margin-bottom:16px}.hero h2{font:700 1.7rem 'Playfair Display',serif;margin:8px 0}.hero p{color:var(--muted);line-height:1.6}.eyebrow{color:var(--gold);font-size:.72rem;letter-spacing:2px;text-transform:uppercase}.support-card{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text);min-height:88px}.support-card:hover{border-color:var(--gold)}.support-icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#241d13;border:1px solid rgba(232,197,71,.35);font-size:30px;flex:none}.support-card strong{font-size:1.05rem}.support-card span{display:block;color:var(--muted);font-size:.84rem;margin-top:4px}.empty{color:var(--muted);text-align:center;padding:24px}@media(max-width:480px){.wrap{padding-left:14px;padding-right:14px}.hero,.support-card{padding:22px}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="dashboard.html">‹</a><h1>Support</h1></div><section class="hero"><div class="eyebrow">Customer Care</div><h2>How can we help?</h2><p>Choose a support channel below. WhatsApp and Telegram open the configured service directly in the appropriate app or browser.</p></section><div id="links"><div class="empty">Loading support…</div></div></main><script src="app.js"></script><script>function card(href,icon,title,sub){return `<a class="support-card" href="${href}" target="_blank" rel="noopener noreferrer"><div class="support-icon">${icon}</div><div><strong>${title}</strong><span>${sub}</span></div></a>`}fetchBin().then(d=>{const s=d.settings||{},box=document.getElementById('links');let h='';if(s.whatsapp)h+=card(s.whatsapp,'◉','WhatsApp','Open WhatsApp support');if(s.telegram)h+=card(s.telegram,'➤','Telegram','Message support on Telegram');box.innerHTML=h||'<div class="empty">Support channels have not been configured yet.</div>'}).catch(()=>document.getElementById('links').innerHTML='<div class="empty">Unable to load support links.</div>');if(!getLoggedUser())location.replace('login.html');</script></body></html>
